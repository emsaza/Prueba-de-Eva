<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Inventario de Dispositivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; background: white; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; font-size: 14px; vertical-align: top; }
    th { background: #e8e8e8; }
    #btn { padding: 10px 20px; border: none; background: #2b7cff; color: white; border-radius: 5px; cursor: pointer; font-size: 16px; }
    #status { color:#666; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <h1>Inventario de Dispositivos</h1>
  <button id="btn">Cargar inventario</button>
  <div id="status"></div>
  <table id="tabla"></table>

  <script>
    const CSV_URL = "https://capgemini.sharepoint.com/sites/Auditorias-SCIB/Shared%20Documents/Inventario-export/Inventario_latest.csv?download=1";

    function parseCSV(text) {
      const rows = [];
      let cur = '', row = [], inQuotes = false, i = 0;
      while (i < text.length) {
        const c = text[i], n = text[i+1];
        if (inQuotes) {
          if (c === '"' && n === '"') { cur += '"'; i += 2; continue; }
          if (c === '"') { inQuotes = false; i++; continue; }
          cur += c; i++; continue;
        } else {
          if (c === '"') { inQuotes = true; i++; continue; }
          if (c === ',') { row.push(cur); cur = ''; i++; continue; }
          if (c === '\r' && n === '\n') { row.push(cur); rows.push(row); row = []; cur=''; i+=2; continue; }
          if (c === '\n' || c === '\r') { row.push(cur); rows.push(row); row = []; cur=''; i++; continue; }
          cur += c; i++; continue;
        }
      }
      row.push(cur); rows.push(row);
      return rows.filter(r => r.some(c => (c||'').trim() !== ''));
    }

    document.getElementById("btn").addEventListener("click", async () => {
      const status = document.getElementById("status");
      status.textContent = "Descargando CSV…";
      try {
        const res = await fetch(CSV_URL, { credentials: "include" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let texto = await res.text();
        if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);

        const filas = parseCSV(texto);
        const tabla = document.getElementById("tabla");
        if (!filas.length) { status.textContent = "El CSV está vacío."; return; }

        tabla.innerHTML = `<tr>${filas[0].map(c => `<th>${c}</th>`).join("")}</tr>`;
        const bodyHtml = filas.slice(1).map(r =>
          `<tr>${r.map(c => `<td>${(c || '').replace(/</g,'&lt;')}</td>`).join("")}</tr>`
        ).join("");
        tabla.insertAdjacentHTML('beforeend', bodyHtml);

        status.textContent = "Inventario cargado.";
      } catch (e) {
        status.textContent = "Error al cargar el CSV. Revisa la URL o permisos.";
        console.error(e);
        alert("No se pudo cargar el CSV. Revisa consola para más detalles.");
      }
    });
  </script>
</body>
</html>
